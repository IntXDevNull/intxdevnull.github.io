<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>linuxlabs.dev</title>
<meta name="description" content="linuxlabs.dev — coming soon.">
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #3ef07a;
    --fg-dim: #1f7a42;
    --fg-bright: #8dffb0;
    --amber: #f0b13e;
    --err: #f04e4e;
    --font: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    height: 100%;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 20px 10vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 3px
      );
    z-index: 2;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 3;
  }
  .term {
    width: 100%;
    max-width: 780px;
    font-size: 14px;
    line-height: 1.55;
    text-shadow: 0 0 6px rgba(62, 240, 122, 0.35);
  }
  @media (min-width: 640px) {
    .term { font-size: 15px; }
  }
  .line {
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0;
    animation: reveal 0.01s forwards;
  }
  @keyframes reveal { to { opacity: 1; } }
  .prompt { color: var(--fg-dim); }
  .ok { color: var(--fg-bright); }
  .warn { color: var(--amber); }
  .dim { color: var(--fg-dim); }
  .bright { color: var(--fg-bright); }
  .neofetch {
    display: flex;
    gap: 28px;
    margin: 18px 0 22px;
    flex-wrap: wrap;
  }
  .neofetch pre {
    margin: 0;
    color: var(--fg);
    font-size: 12px;
    line-height: 1.15;
    flex-shrink: 0;
    opacity: 0;
  }
  .neofetch .info {
    font-size: 13px;
    min-width: 220px;
  }
  .neofetch .info div { margin-bottom: 2px; }
  .neofetch .key { color: var(--fg-bright); }
  .swatches {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .swatches span {
    width: 16px;
    height: 12px;
    display: inline-block;
  }
  .coming-soon {
    margin-top: 28px;
    font-size: 20px;
  }
  @media (min-width: 640px) {
    .coming-soon { font-size: 24px; }
  }
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--fg-bright);
    vertical-align: -0.15em;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .footer {
    margin-top: 32px;
    color: var(--fg-dim);
    font-size: 12px;
  }
  .footer a {
    color: var(--fg-dim);
    text-decoration: underline;
    text-decoration-color: var(--fg-dim);
  }
  .footer a:hover { color: var(--fg-bright); text-decoration-color: var(--fg-bright); }
  ::selection { background: var(--fg); color: var(--bg); }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div class="term" id="term" role="log" aria-live="polite"></div>
<script>
(function () {
  const term = document.getElementById('term');

  const tux = `      .--.
     |o_o |
     |:_/ |
    //   \\ \\
   (|     | )
  /'\\_   _/\`\\
  \\___)=(___/`;

  // Sequential boot lines: [text, className, delayAfterMs]
  const bootLines = [
    ['guest@linuxlabs:~$ ssh deploy@linuxlabs.dev', 'prompt', 500],
    ['Connecting to linuxlabs.dev (0.0.0.0)...', 'dim', 350],
    ['Authenticating with public key... accepted', 'ok', 300],
    ['Welcome to linuxlabs.dev', 'bright', 250],
    ['Last login: never', 'dim', 400],
    ['', 'dim', 100],
    ['guest@linuxlabs:~$ neofetch', 'prompt', 600],
  ];

  const footerLines = [
    ['', 'dim', 100],
    ['guest@linuxlabs:~$ cat status.txt', 'prompt', 500],
  ];

  let idx = 0;

  function typeLine(text, cls, done) {
    const el = document.createElement('div');
    el.className = 'line ' + cls;
    term.appendChild(el);

    if (text === '') { el.innerHTML = '&nbsp;'; done(); return; }

    let i = 0;
    const speed = 14;
    function step() {
      el.textContent = text.slice(0, i);
      i++;
      if (i <= text.length) {
        setTimeout(step, speed);
      } else {
        done();
      }
    }
    step();
  }

  function runBoot() {
    if (idx >= bootLines.length) {
      renderNeofetch();
      return;
    }
    const [text, cls, delay] = bootLines[idx];
    idx++;
    typeLine(text, cls, () => setTimeout(runBoot, delay));
  }
  function renderNeofetch() {
    const wrap = document.createElement('div');
    wrap.className = 'neofetch';
    const pre = document.createElement('pre');
    pre.textContent = tux;
    pre.style.opacity = '1';
    const info = document.createElement('div');
    info.className = 'info';
    info.style.opacity = '1';
    info.innerHTML = `
      <div><span class="key">guest</span><span class="dim">@</span><span class="key">linuxlabs.dev</span></div>
      <div class="dim">-----------------------</div>
      <div><span class="key">OS:</span> Status: Unindexed</div>
      <div><span class="key">Host:</span> GitHub Pages</div>
      <div><span class="key">Kernel:</span> 0.0.1-pre-alpha</div>
      <div><span class="key">Uptime:</span> just booted</div>
      <div><span class="key">Packages:</span> 0 installed</div>
      <div><span class="key">Shell:</span> /bin/patience</div>
      <div><span class="key">Resolution:</span> your imagination</div>
      <div><span class="key">DE:</span> none yet</div>
      <div><span class="key">Terminal:</span> you're looking at it</div>
      <div class="swatches">
        <span style="background:#3ef07a"></span>
        <span style="background:#8dffb0"></span>
        <span style="background:#1f7a42"></span>
        <span style="background:#f0b13e"></span>
        <span style="background:#f04e4e"></span>
        <span style="background:#0a0e0a;border:1px solid #1f7a42"></span>
      </div>
    `;
    wrap.appendChild(pre);
    wrap.appendChild(info);
    term.appendChild(wrap);
    runFooter();
  }
  let fIdx = 0;
  function runFooter() {
    if (fIdx >= footerLines.length) {
      renderComingSoon();
      return;
    }
    const [text, cls, delay] = footerLines[fIdx];
    fIdx++;
    typeLine(text, cls, () => setTimeout(runFooter, delay));
  }
  function renderComingSoon() {
    const csWrap = document.createElement('div');
    csWrap.className = 'line coming-soon bright';
    term.appendChild(csWrap);
    const text = 'Coming soon.';
    let i = 0;
    const speed = 55;
    function step() {
      csWrap.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
      i++;
      if (i <= text.length) {
        setTimeout(step, speed);
      } else {
        finish();
      }
    }
    step();
  }
  function finish() {
    const footer = document.createElement('div');
    footer.className = 'footer';
    footer.style.opacity = '1';
    footer.innerHTML = `linuxlabs.dev &middot; built in the open &middot; <a href="https://github.com/intxdevnull" target="_blank" rel="noopener">github.com/intxdevnull</a>`;
    term.appendChild(footer);
  }
  runBoot();
})();
</script>
</body>
</html>
