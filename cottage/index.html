<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Før hytten forlates</title>
<meta name="description" content="Sjekkliste for gjester før hytten forlates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF0EB;
    --paper: #FAFBF9;
    --ink: #17211C;
    --muted: #55635A;
    --line: #CFD7CE;
    --accent: #1F4A38;
    --on-accent: #F4F8F4;
    --done-bg: #E0EAE2;
    --falu: #9A2F24;
    --lake: #33677C;
    --focus: #C27A00;
    --serif: "Bitter", Georgia, "Times New Roman", serif;
    --sans: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1712;
      --paper: #16211A;
      --ink: #E8EEE8;
      --muted: #9CAAA1;
      --line: #2B3A30;
      --accent: #6FBF94;
      --on-accent: #0D1A12;
      --done-bg: #1B2A21;
      --falu: #E58A7E;
      --lake: #7FBAD1;
      --focus: #F2B440;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1712;
    --paper: #16211A;
    --ink: #E8EEE8;
    --muted: #9CAAA1;
    --line: #2B3A30;
    --accent: #6FBF94;
    --on-accent: #0D1A12;
    --done-bg: #1B2A21;
    --falu: #E58A7E;
    --lake: #7FBAD1;
    --focus: #F2B440;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.125rem;
    line-height: 1.5;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  h1 {
    font-family: var(--serif); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.4rem);
    line-height: 1.05; margin: 0 0 .6rem; letter-spacing: -.01em;
  }
  .lead { margin: 0 0 1.75rem; color: var(--muted); max-width: 34rem; }

  /* progress */
  .progress { margin-bottom: 1.5rem; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .5rem; font-weight: 700; }
  .progress-top .count { font-family: var(--serif); font-size: 1.25rem; }
  .segments { display: flex; gap: 4px; }
  .segments i { flex: 1; height: 12px; border-radius: 3px; background: var(--line); transition: background .2s; }
  .segments i.on { background: var(--accent); }

  /* season switch */
  .season {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .75rem 1rem; margin-bottom: 1rem; border: 2px dashed var(--line); border-radius: 10px;
    font-size: 1rem; color: var(--muted);
  }
  .season strong { color: var(--ink); }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper); }
  .seg button {
    font: inherit; font-size: .95rem; font-weight: 700; color: var(--muted);
    background: transparent; border: 0; padding: .4rem .9rem; cursor: pointer; min-height: 40px;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* list */
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  .item {
    display: grid; grid-template-columns: 44px 1fr; gap: .9rem; align-items: start;
    background: var(--paper); border: 2px solid var(--line); border-radius: 10px;
    padding: 1rem; cursor: pointer; position: relative;
    transition: background .15s, border-color .15s;
  }
  .item.important { border-color: var(--falu); }
  .item input.check { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .box {
    width: 44px; height: 44px; border-radius: 8px; border: 2.5px solid var(--accent);
    display: grid; place-items: center; font-family: var(--serif); font-weight: 800; font-size: 1.15rem;
    color: var(--accent); background: transparent; transition: background .15s, color .15s;
  }
  .item.important .box { border-color: var(--falu); color: var(--falu); }
  .box svg { display: none; width: 26px; height: 26px; }
  .item input.check:checked ~ .box { background: var(--accent); color: var(--on-accent); }
  .item.important input.check:checked ~ .box { background: var(--falu); }
  .item input.check:checked ~ .box .num { display: none; }
  .item input.check:checked ~ .box svg { display: block; }
  .item:has(input.check:checked) { background: var(--done-bg); border-color: transparent; }
  .item input.check:checked ~ .body .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .item input.check:focus-visible ~ .box { outline: 3px solid var(--focus); outline-offset: 3px; }
  .item.off { opacity: .55; cursor: default; }
  .item.off input.check { cursor: default; }
  .body { padding-top: .35rem; }
  .text { display: block; }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .tag { font-size: .875rem; font-weight: 700; border: 2px solid currentColor; border-radius: 6px; padding: 0 .5rem; }
  .tag.winter { color: var(--falu); }
  .tag.year { color: var(--lake); }
  .tag.skip { color: var(--muted); }

  /* image expand */
  .img-toggle {
    position: relative; z-index: 2; display: inline-flex; align-items: center; gap: .35rem;
    margin-top: .6rem; font: inherit; font-size: .9rem; font-weight: 700; color: var(--accent);
    background: transparent; border: 2px solid var(--accent); border-radius: 999px;
    padding: .35rem .8rem; cursor: pointer; min-height: 40px;
  }
  .img-toggle svg { width: 18px; height: 18px; flex: none; }
  .img-toggle[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); }
  .img-wrap {
    margin-top: .75rem; display: none; position: relative; z-index: 2;
    border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg);
  }
  .img-wrap.open { display: block; }
  .img-wrap img { display: block; width: 100%; height: auto; }
  .img-fallback { padding: 1rem; font-size: .9rem; color: var(--muted); }

  /* closing */
  .closing {
    margin-top: 2rem; padding: 1.5rem; border-radius: 10px; border: 2px solid var(--line);
    background: var(--paper); text-align: left;
  }
  .closing h2 { font-family: var(--serif); font-size: 1.6rem; margin: 0 0 .25rem; }
  .closing p { margin: 0; color: var(--muted); }
  .closing.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .closing.done p { color: var(--on-accent); }
  .closing .status { display: none; font-weight: 700; margin-bottom: .75rem; }
  .closing.done .status { display: block; }

  .reset {
    margin-top: 1.25rem; font: inherit; font-weight: 700; color: var(--muted);
    background: none; border: 2px solid var(--line); border-radius: 8px; padding: .55rem 1rem; cursor: pointer; min-height: 44px;
  }
  .reset:hover { color: var(--ink); border-color: var(--muted); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>Før hytten forlates</h1>
  <p class="lead">Gå gjennom listen før dere låser og drar. Trykk på et punkt når det er gjort.</p>

  <section class="progress" aria-live="polite">
    <div class="progress-top"><span>Fremdrift</span><span class="count" id="count"></span></div>
    <div class="segments" id="segments" aria-hidden="true"></div>
  </section>

  <div class="season">
    <span>Hvilken årstid er det?</span>
    <div class="seg" role="group" id="seasonSeg">
      <button type="button" data-winter="0" aria-pressed="false">Sommerhalvåret</button>
      <button type="button" data-winter="1" aria-pressed="false">Vinterhalvåret</button>
    </div>
  </div>

  <ol id="list"></ol>

  <section class="closing" id="closing">
    <div class="status">Alt er gjort. Dere kan låse og dra.</div>
    <h2>TAKK, og god fornøyelse.</h2>
    <p>Vi setter stor pris på at dere tar vare på hytten.</p>
  </section>

  <button type="button" class="reset" id="reset">Nullstill listen</button>
</main>

<script>
(function () {
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  var CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3l1.5-2h7l1.5 2h3v11H4z"/><circle cx="12" cy="14" r="3.3"/></svg>';

  // Bildene hentes fra images/ + filnavn. Legg selve bildefilene i en "images"-mappe
  // ved siden av denne HTML-filen, med samme filnavn som er oppgitt her.
  var IMAGE_BASE = 'images/';

  var ITEMS = [
    { text: 'Påse at begge de store ventilene i mønet står oppe. Gjelder hele året.' },
    { text: 'Påse at kjøleskapdøren står på gløtt.' },
    { text: 'Påse at alle vinduer er lukket og låst.' },
    { text: 'Påse at det er ved/opptenningsved klart til neste person.' },
    { text: 'Påse at det er ryddig og rent etter deg/dere.' },
    { text: 'Påse at gassen er slått av på kjøkken og gassovn i stue.' },
    { text: 'Påse at bøttene er tømt for vann.' },
    { text: 'Viktig: Påse at strømmen i hytta er slått av ved å rotere strømbryteren mot høyre.', image: 'solcelle_bryter.png', important: true },
    { text: 'Påse at begge bodene er låst.' },
    { text: 'Vinterstid: Tøm ett glass med frostvæske i sluket på kjøkkenet.', tag: 'winter' }
  ];

  var KEY = 'hytte-sjekkliste-v2';
  var autoWinter = (function () { var m = new Date().getMonth(); return m >= 9 || m <= 3; })(); // okt til apr
  var state = { checked: {}, winter: null };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      if (saved.checked && typeof saved.checked === 'object') state.checked = saved.checked;
      if (saved.winter === true || saved.winter === false) state.winter = saved.winter;
    }
  } catch (e) { /* lagring utilgjengelig, går videre uten */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function isWinter() { return state.winter === null ? autoWinter : state.winter; }
  function isActive(item) { return !(item.tag === 'winter' && !isWinter()); }

  var $ = function (id) { return document.getElementById(id); };
  var list = $('list');

  function render() {
    var sb = document.querySelectorAll('#seasonSeg button');
    sb[0].setAttribute('aria-pressed', String(!isWinter()));
    sb[1].setAttribute('aria-pressed', String(isWinter()));

    list.innerHTML = '';
    ITEMS.forEach(function (item, i) {
      var active = isActive(item);
      var li = document.createElement('li');
      var label = document.createElement('label');
      label.className = 'item' + (active ? '' : ' off') + (item.important ? ' important' : '');

      var input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'check';
      input.checked = !!state.checked[i] && active;
      input.disabled = !active;
      input.addEventListener('change', function () {
        state.checked[i] = input.checked;
        save();
        updateProgress();
        label.className = 'item' + (active ? '' : ' off') + (item.important ? ' important' : '');
      });

      var box = document.createElement('span');
      box.className = 'box';
      box.setAttribute('aria-hidden', 'true');
      box.innerHTML = '<span class="num">' + (i + 1) + '</span>' + CHECK;

      var body = document.createElement('span');
      body.className = 'body';
      var tx = document.createElement('span');
      tx.className = 'text';
      tx.textContent = item.text;
      body.appendChild(tx);

      if (item.tag) {
        var tags = document.createElement('span');
        tags.className = 'tags';
        var tag = document.createElement('span');
        tag.className = 'tag ' + item.tag;
        tag.textContent = item.tag === 'winter' ? 'Gjelder vinterhalvåret' : 'Gjelder hele året';
        tags.appendChild(tag);
        if (!active) {
          var skip = document.createElement('span');
          skip.className = 'tag skip';
          skip.textContent = 'Hoppes over nå';
          tags.appendChild(skip);
        }
        body.appendChild(tags);
      }

      if (item.image) {
        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'img-toggle';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.innerHTML = CAMERA + '<span>Vis bilde</span>';

        var imgWrap = document.createElement('span');
        imgWrap.className = 'img-wrap';
        var img = document.createElement('img');
        img.src = IMAGE_BASE + item.image;
        img.alt = item.text;
        img.loading = 'lazy';
        img.addEventListener('error', function () {
          imgWrap.innerHTML = '<span class="img-fallback">Fant ikke bildet ' + IMAGE_BASE + item.image + '</span>';
        });
        imgWrap.appendChild(img);

        toggle.addEventListener('click', function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var open = imgWrap.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.querySelector('span').textContent = open ? 'Skjul bilde' : 'Vis bilde';
        });

        body.appendChild(toggle);
        body.appendChild(imgWrap);
      }

      label.appendChild(input);
      label.appendChild(box);
      label.appendChild(body);
      li.appendChild(label);
      list.appendChild(li);
    });
    updateProgress();
  }

  function updateProgress() {
    var total = 0, done = 0;
    ITEMS.forEach(function (item, i) {
      if (!isActive(item)) return;
      total++;
      if (state.checked[i]) done++;
    });
    $('count').textContent = done + ' av ' + total + ' gjort';
    var seg = $('segments');
    seg.innerHTML = '';
    for (var s = 0; s < total; s++) {
      var el = document.createElement('i');
      if (s < done) el.className = 'on';
      seg.appendChild(el);
    }
    $('closing').className = 'closing' + (done === total && total > 0 ? ' done' : '');
  }

  document.querySelectorAll('#seasonSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.winter = b.getAttribute('data-winter') === '1';
      save(); render();
    });
  });
  $('reset').addEventListener('click', function () {
    state.checked = {};
    save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  render();
})();
</script>
</body>
</html>
