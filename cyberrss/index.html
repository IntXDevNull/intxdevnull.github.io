<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOC Dashboard</title>

<style>
:root {
    --bg:#080d16;
    --panel:#111827;
    --panel2:#162033;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --blue:#22d3ee;
    --red:#ef4444;
    --orange:#f97316;
    --green:#22c55e;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}


/* HEADER */

header {
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:#020617;
    border-bottom:1px solid #1e293b;
}

.logo {
    font-size:22px;
    font-weight:bold;
    color:var(--blue);
}

.controls button {
    background:var(--panel2);
    color:white;
    border:1px solid #334155;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
}

.controls button:hover {
    border-color:var(--blue);
}


/* MAIN */

.container {
    padding:20px;
}


/* CARDS */

.cards {
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;
}


.card {
    background:var(--panel);
    padding:20px;
    border-radius:12px;
    border:1px solid #1e293b;
}


.card h3 {
    margin:0;
    color:var(--muted);
    font-size:14px;
}

.card p {
    font-size:32px;
    margin:10px 0 0;
    color:var(--blue);
}



/* SEARCH */

.search {
    margin:25px 0;
}


input {
    width:100%;
    padding:14px;
    background:var(--panel);
    color:white;
    border:1px solid #334155;
    border-radius:8px;
    font-size:16px;
}



/* NEWS */

.news {
    background:var(--panel);
    border-radius:12px;
    border:1px solid #1e293b;
    overflow:hidden;
}


.news-header {
    padding:15px;
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #334155;
}


.article {
    padding:15px;
    border-bottom:1px solid #1e293b;
}


.article:hover {
    background:var(--panel2);
}


.article a {
    color:var(--blue);
    text-decoration:none;
    font-size:17px;
}


.meta {
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}


.badge {
    display:inline-block;
    padding:3px 8px;
    border-radius:20px;
    font-size:12px;
    margin-left:5px;
}


.critical {
    background:var(--red);
}

.high {
    background:var(--orange);
}

.normal {
    background:#2563eb;
}


/* MOBILE */

@media(max-width:600px){

header {
    flex-direction:column;
    height:auto;
    padding:15px;
}

}

</style>

</head>


<body>

<header>

<div class="logo">
🛡 SOC Dashboard
</div>


<div class="controls">

<button onclick="refreshData()">
🔄 Refresh
</button>


<button onclick="toggleTheme()">
🌙
</button>

</div>

</header>


<div class="container">


<section class="cards">


<div class="card">
<h3>Total Articles</h3>
<p id="totalArticles">0</p>
</div>


<div class="card">
<h3>Critical Alerts</h3>
<p id="criticalCount">0</p>
</div>


<div class="card">
<h3>High Severity</h3>
<p id="highCount">0</p>
</div>


<div class="card">
<h3>Sources</h3>
<p id="sourceCount">0</p>
</div>


</section>


<div class="search">

<input
id="search"
placeholder="Search security news..."
onkeyup="searchArticles()">

</div>


<section class="news">

<div class="news-header">
Latest Security Intelligence
</div>


<div id="newsList"></div>


</section>


</div>
<script>

////////////////////////////////////////////////////
// SOC DASHBOARD DATA ENGINE
////////////////////////////////////////////////////


const feeds = [

{
source:"Krebs on Security",
url:"https://krebsonsecurity.com/feed/"
},

{
source:"BleepingComputer",
url:"https://www.bleepingcomputer.com/feed/"
},

{
source:"The Hacker News",
url:"https://feeds.feedburner.com/TheHackersNews"
},

{
source:"SANS ISC",
url:"https://isc.sans.edu/rssfeed.xml"
},

{
source:"Cisco Talos",
url:"https://blog.talosintelligence.com/feeds/posts/default"
}

];



////////////////////////////////////////////////////
// TEMP DATA
// Replaced with RSS in Part 3
////////////////////////////////////////////////////


let articles = [

{
title:
"Critical vulnerability discovered in enterprise software",
source:
"Krebs on Security",
date:
"Today",
category:
"CVE",
severity:
"critical",
url:
"#"
},


{
title:
"New ransomware campaign targets Windows systems",
source:
"BleepingComputer",
date:
"Today",
category:
"Ransomware",
severity:
"high",
url:
"#"
},


{
title:
"Google Project Zero publishes browser exploit research",
source:
"Google Project Zero",
date:
"Yesterday",
category:
"Zero-Day",
severity:
"high",
url:
"#"
},


{
title:
"Cloud security best practices for organizations",
source:
"Cloudflare",
date:
"Yesterday",
category:
"Cloud",
severity:
"normal",
url:
"#"
}

];



////////////////////////////////////////////////////
// INITIAL LOAD
////////////////////////////////////////////////////


document.addEventListener(
"DOMContentLoaded",
()=>{

loadBookmarks();

renderArticles();

updateStats();

}

);



////////////////////////////////////////////////////
// RENDER ARTICLES
////////////////////////////////////////////////////


function renderArticles(list=articles){


const container =
document.getElementById(
"newsList"
);


container.innerHTML="";


list.forEach(
(article,index)=>{


let bookmark =
isBookmarked(article.title)
?
"⭐"
:
"☆";



container.innerHTML += `


<div class="article">


<a href="${article.url}" target="_blank">

${article.title}

</a>


<span class="badge ${article.severity}">

${article.severity.toUpperCase()}

</span>


<div class="meta">

${article.source}
|
${article.date}
|
${article.category}


<button
onclick="bookmarkArticle(${index})"
style="
float:right;
background:none;
border:0;
color:#22d3ee;
cursor:pointer;
">

${bookmark}

</button>


</div>


</div>


`;

});


}




////////////////////////////////////////////////////
// SEARCH
////////////////////////////////////////////////////


function searchArticles(){


let query =
document
.getElementById("search")
.value
.toLowerCase();



let filtered =
articles.filter(
a=>

a.title
.toLowerCase()
.includes(query)

||

a.source
.toLowerCase()
.includes(query)

||

a.category
.toLowerCase()
.includes(query)

);



renderArticles(filtered);


}




////////////////////////////////////////////////////
// STATISTICS
////////////////////////////////////////////////////


function updateStats(){


document
.getElementById("totalArticles")
.innerText =
articles.length;



document
.getElementById("criticalCount")
.innerText =
articles.filter(
a=>a.severity==="critical"
)
.length;



document
.getElementById("highCount")
.innerText =
articles.filter(
a=>a.severity==="high"
)
.length;



document
.getElementById("sourceCount")
.innerText =
new Set(
articles.map(
a=>a.source
)
)
.size;


}




////////////////////////////////////////////////////
// BOOKMARKS
////////////////////////////////////////////////////


let bookmarks=[];



function loadBookmarks(){


bookmarks =
JSON.parse(
localStorage.getItem(
"socBookmarks"
)
)
||
[];

}




function bookmarkArticle(index){


let article =
articles[index];


let exists =
bookmarks.some(
b=>b.title===article.title
);



if(exists){


bookmarks =
bookmarks.filter(
b=>b.title!==article.title
);


}
else{


bookmarks.push(article);


}



localStorage.setItem(
"socBookmarks",
JSON.stringify(bookmarks)
);


renderArticles();


}




function isBookmarked(title){


return bookmarks.some(
b=>b.title===title
);


}



////////////////////////////////////////////////////
// REFRESH
////////////////////////////////////////////////////


function refreshData(){


let button =
document.querySelector(".controls button");


button.innerText =
"⏳ Loading";


setTimeout(()=>{


updateStats();

renderArticles();


button.innerText =
"🔄 Refresh";


},800);


}




////////////////////////////////////////////////////
// THEME
////////////////////////////////////////////////////


function toggleTheme(){


if(
document.body.dataset.light
){


document.body.dataset.light="";


document.documentElement.style
.setProperty(
"--bg",
"#080d16"
);


}
else{


document.body.dataset.light="yes";


document.documentElement.style
.setProperty(
"--bg",
"#f1f5f9"
);


document.documentElement.style
.setProperty(
"--text",
"#020617"
);


}


}



////////////////////////////////////////////////////
// AUTO REFRESH TIMER
////////////////////////////////////////////////////


setInterval(

()=>{

refreshData();
async function refreshData(){

    let button =
    document.querySelector(".controls button");

    button.innerText="⏳ Loading";


    try {

        let liveArticles =
        await loadRSSFeeds();


        if(liveArticles.length){

            articles =
            liveArticles;

            updateStats();
            renderArticles();

        }


    }

    catch(error){

        console.error(
            "Feed loading failed:",
            error
        );

    }


    button.innerText="🔄 Refresh";

}
},

60*60*1000

);

////////////////////////////////////////////////////
// RSS ENGINE
////////////////////////////////////////////////////


async function loadRSSFeeds(){


const rssSources = [

{
name:"Krebs",
url:
"https://krebsonsecurity.com/feed/"
},

{
name:"BleepingComputer",
url:
"https://www.bleepingcomputer.com/feed/"
},

{
name:"The Hacker News",
url:
"https://feeds.feedburner.com/TheHackersNews"
},

{
name:"SANS ISC",
url:
"https://isc.sans.edu/rssfeed.xml"
}

];



let results=[];



for(
let feed of rssSources
){


try{


let api =

"https://api.rss2json.com/v1/api.json?rss_url="

+
encodeURIComponent(
feed.url
);



let response =
await fetch(api);



let data =
await response.json();



data.items
.slice(0,10)
.forEach(
item=>{


results.push({

title:
item.title,


source:
feed.name,


date:
new Date(
item.pubDate
)
.toLocaleDateString(),


category:
detectCategory(
item.title
),


severity:
detectSeverity(
item.title
),


url:
item.link


});


});


}

catch(e){

console.log(
"Feed failed:",
feed.name
);

}


}



return results.sort(
(a,b)=>
new Date(b.date)
-
new Date(a.date)
);


}




////////////////////////////////////////////////////
// SECURITY CLASSIFICATION
////////////////////////////////////////////////////


function detectSeverity(text){


text =
text.toLowerCase();



if(
text.includes("critical")
||
text.includes("zero-day")
||
text.includes("actively exploited")
)

return "critical";



if(
text.includes("cve")
||
text.includes("ransomware")
||
text.includes("exploit")
||
text.includes("malware")
)

return "high";



return "normal";


}




function detectCategory(text){


text =
text.toLowerCase();



if(text.includes("cve"))
return "CVE";


if(text.includes("ransomware"))
return "Ransomware";


if(text.includes("cloud"))
return "Cloud";


if(
text.includes("linux")
)
return "Linux";


if(
text.includes("windows")
)
return "Windows";


return "Security";


}
</script>


</body>
</html>
