<head>
  <meta charset="UTF-8" />

  <title>GTA VI Countdown — Release Date Timer | November 19, 2026</title>
  <meta name="description" content="An unofficial countdown to the Grand Theft Auto VI release date, November 19, 2026. Live days, hours, minutes and seconds timer with a Vice City-inspired sunset design." />
  <meta name="keywords" content="GTA 6, GTA VI, Grand Theft Auto VI, countdown, release date, timer, Vice City, Rockstar Games" />

  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GTA VI Countdown — The Wait Is Almost Over" />
  <meta name="twitter:description" content="A live, unofficial countdown to Grand Theft Auto VI, launching November 19, 2026." />

  <meta name="theme-color" content="#0a0512" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2d95'/%3E%3Cstop offset='1' stop-color='%237b2ff7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0512'/%3E%3Cpath d='M50 14 L82 50 L50 86 L18 50 Z' fill='none' stroke='url(%23g)' stroke-width='9'/%3E%3C/svg%3E" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="scene__sun"></div>
    <div class="scene__grid"></div>
    <div class="scene__noise"></div>
  </div>

  <div class="page">

    <header class="hero">
      <p class="hero__kicker">Countdown</p>

      <h1 class="hero__title">
        <span class="hero__title-sub">Grand Theft Auto</span>
        <span class="hero__title-main">VI</span>
      </h1>

      <p class="hero__subtitle">The wait is almost over.</p>

      <main id="countdown-section" aria-label="Countdown to GTA VI release">

        <div id="countdown" class="countdown" aria-live="polite">
          <div class="countdown__unit">
            <span class="countdown__value" id="days">00</span>
            <span class="countdown__label">Days</span>
          </div>
          <div class="countdown__sep" aria-hidden="true">:</div>
          <div class="countdown__unit">
            <span class="countdown__value" id="hours">00</span>
            <span class="countdown__label">Hours</span>
          </div>
          <div class="countdown__sep" aria-hidden="true">:</div>
          <div class="countdown__unit">
            <span class="countdown__value" id="minutes">00</span>
            <span class="countdown__label">Minutes</span>
          </div>
          <div class="countdown__sep" aria-hidden="true">:</div>
          <div class="countdown__unit">
            <span class="countdown__value" id="seconds">00</span>
            <span class="countdown__label">Seconds</span>
          </div>
        </div>

        <div id="released" class="released" hidden>
          <p class="released__headline">GTA VI IS OUT NOW</p>
          <p class="released__sub">Welcome back to the state of Leonida.</p>
        </div>

        <p class="release-date">
          Release date: <time datetime="2026-11-19">November 19, 2026</time>
          <span class="release-date__zone" id="local-zone"></span>
        </p>

        <div class="progress" role="group" aria-label="Progress toward release">
          <div class="progress__track">
            <div class="progress__fill" id="progress-fill"></div>
          </div>
          <p class="progress__label" id="progress-label">Calculating progress&hellip;</p>
        </div>

      </main>
    </header>

    <footer class="site-footer">
      <p class="site-footer__meta">Countdown target: November 19, 2026 · Local time is used automatically.</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
